# EatWhatService 自建（云服务 / CVM）部署编排
# 用法：在含 docker-compose.yml 的目录下
#   1) cp .env.example .env  并填好密码与微信小程序配置
#   2) docker compose up -d
#
# 架构：
#   公网 80/443 -> 宿主机 Caddy -> 127.0.0.1:8080 -> app:8080
#   本文件只管理 app；MySQL 由 docker-compose.mysql.yml 单独管理。

services:
  app:
    build: .
    container_name: eatwhat-app
    restart: always
    environment:
      # compose 内网用服务名 `mysql` 互通，无需服务器 IP
      MYSQL_ADDRESS: mysql:3306
      MYSQL_DATABASE: eatwhat
      MYSQL_USERNAME: eatwhat
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 容器内监听端口
      SERVER_PORT: "8080"
      # 微信小程序（自建部署后用于 code2session 换取 openid）
      WX_APPID: ${WX_APPID}
      WX_SECRET: ${WX_SECRET}
      # JWT 登录态（务必改成随机强密钥，且各实例一致）
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-720}
    # 仅供宿主机 Caddy 访问，不暴露到公网网卡。
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  backend:
    name: eatwhat-backend
    external: true
