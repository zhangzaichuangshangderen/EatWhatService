# EatWhatService 自建（云服务 / CVM）部署编排
# 用法：在含 docker-compose.yml 的目录下
#   1) cp .env.example .env  并填好密码与微信小程序配置
#   2) docker compose up -d
#
# 端口说明：
#   - app 容器内监听 8080（由 SERVER_PORT 控制），本机映射到 8080；
#   - 生产环境请在前端用 Nginx/Caddy 做 HTTPS 反代（见 nginx/nginx.conf 示例），
#     将 443 -> 127.0.0.1:8080，小程序通过 https://你的域名/api/... 访问。

services:
  app:
    build: .
    container_name: eatwhat-app
    restart: always
    environment:
      # compose 内网用服务名 `mysql` 互通，无需服务器 IP
      MYSQL_ADDRESS: mysql:3306
      MYSQL_DATABASE: eatwhat
      MYSQL_USERNAME: eatwhat
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 容器内监听端口
      SERVER_PORT: "8080"
      # 微信小程序（自建部署后用于 code2session 换取 openid）
      WX_APPID: ${WX_APPID}
      WX_SECRET: ${WX_SECRET}
      # JWT 登录态（务必改成随机强密钥，且各实例一致）
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-720}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: eatwhat-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: eatwhat
      MYSQL_USER: eatwhat
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动建库建表（db.sql 内含 CREATE DATABASE + 各表）
      - ./src/main/resources/db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
