server:
  # 容器内监听端口；自建部署时由 SERVER_PORT 覆盖（通常 8080，交给 Nginx 反代）
  port: ${SERVER_PORT:80}


spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_ADDRESS}/${MYSQL_DATABASE:eatwhat}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  mvc:
    view:
      suffix: .html
      prefix: /

mybatis:
  mapper-locations: classpath*:mapper/*Mapper.xml

# 微信小程序配置（自建部署后用于 code2session 换取 openid，替代云托管自动注入）
wx:
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}

# JWT 登录态配置
jwt:
  # 必须改成随机强密钥，且所有实例保持一致
  secret: ${JWT_SECRET:change-me-in-production}
  expire-hours: ${JWT_EXPIRE_HOURS:720}
