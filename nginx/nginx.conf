# EatWhatService 生产 HTTPS 反代示例（Nginx）
# 用法：
#   1) 将本文件放到 /etc/nginx/conf.d/eatwhat.conf（或 include 进来）
#   2) 把你的证书放到对应路径（下面示例为 /etc/nginx/ssl/）
#   3) 将 server_name 改成你的域名
#   4) nginx -t && nginx -s reload
#
# 前置条件：docker-compose 已把 app 暴露在本机 127.0.0.1:8080

server {
    listen 80;
    server_name eatwhat.example.com;

    # 证书申请/续期用（如 certbot）。如暂不需要可删除此块。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name eatwhat.example.com;

    ssl_certificate     /etc/nginx/ssl/eatwhat.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/eatwhat.privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 小程序接口反代到本地 app 容器
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态首页（如需对外提供）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
