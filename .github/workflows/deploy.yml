name: Deploy to Server

# 触发：推送到 master 自动部署；也可在 Actions 页面手动触发
on:
  push:
    branches: [master]
  workflow_dispatch:

# 同一时间只跑一个部署，避免并发把容器搞乱
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  # 服务器上仓库 clone 的目录，请按你的实际路径修改
  DEPLOY_PATH: /opt/EatWhatService

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ env.DEPLOY_PATH }}"

            # 拉取最新 master（reset --hard 保证工作区干净，不带入本地改动）
            git fetch origin master
            git reset --hard origin/master

            # 兼容 docker compose v2 / v1
            if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi

            # 只重建 app；mysql 有 volume 与 restart:always，数据不受影响
            $DC up -d --build app

            # 清理悬空镜像，释放磁盘
            docker image prune -f
